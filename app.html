<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain 3D</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet"> 

    <!-- Cesium libraries (local build) -->
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="/cesium/Cesium.js"></script>
    
    <!-- Proj4js for proper coordinate conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.min.js"></script>
    
    <!-- Two.js for 2D graphics and canvas manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

    <!-- 3D View CSS library -->
    <link href="/css/styles.css" rel="stylesheet">

    <!-- GoogleMaps2D CSS removed to improve performance -->

    <!-- Menu and View Switch CSS -->
    <link href="/css/menu.css" rel="stylesheet">
    
    <!-- Focus Panel CSS -->
    <link href="/css/focusPanel.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #072b2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    ">
        <img src="/images/ecodash_white_cropped.webp" alt="Ecodash Logo" style="
            max-width: 300px;
            margin-bottom: 40px;
        ">
        
        <div style="
            width: 400px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        ">
            <div id="loadingBar" style="
                width: 100%;
                height: 10px;
                background: rgba(255, 255, 255, 0.3);
                border-radius: 5px;
                overflow: hidden;
                margin-bottom: 25px;
            ">
                <div id="loadingProgress" style="
                    width: 100%;
                    height: 100%;
                    background: white;
                    border-radius: 5px;
                    transform: scaleX(0);
                    transform-origin: left;
                    transition: transform 0.1s ease-out;
                "></div>
            </div>
            
            <div id="loadingMessage" style="
                color: white;
                font-family: 'Courier New', monospace;
                font-size: 14px;
                font-weight: bold;
                margin-bottom: 8px;
            ">Loading...</div>
            <div id="loadingPercentage" style="
                color: white;
                font-family: 'Courier New', monospace;
                font-size: 16px;
                font-weight: bold;
            ">0%</div>
            <script>
                // Log when loading screen first becomes visible
                // Loading screen display logging removed for cleaner console output
            </script>
        </div>
    </div>

    <!-- Cesium 3D Container -->
    <div id="cesiumContainer"></div>

    <!-- GoogleMaps2D container removed to improve performance -->

    <!-- Terrain 3D Logo -->
    <img id="logo" src="/images/ecodash_white_cropped.webp" alt="Terrain 3D Logo">
    
    <!-- Message Box -->
    <div id="messageBox"></div>

    <!-- Unified Control Panel -->
    <div id="controlPanel" class="control-panel">
        <!-- Top row: buttons + site selector -->
        <div class="control-group view-controls">
            <!-- Tilt Controls - COMMENTED OUT -->
            <!-- <button id="tilt0Button" class="control-button icon-button tilt-0-button" title="Top-down view"></button>
            <button id="tilt45Button" class="control-button icon-button tilt-45-button" title="Angled view"></button> -->

            <!-- Rotation Controls - COMMENTED OUT -->
            <!-- <button id="rotateLeftButton" class="control-button icon-button rotate-left-button" title="Rotate left 90°"></button>
            <button id="rotateRightButton" class="control-button icon-button rotate-right-button" title="Rotate right 90°"></button> -->

            <!-- Navigation Controls -->
            <!-- <button id="homeButton" class="control-button icon-button home-button" title="Go to my location"></button>
            <button id="terrainToggleButton" class="control-button text-button terrain-toggle" title="Switch between high quality and performance modes">HQ</button> -->
            <button id="viewSwitchButton" class="control-button text-button view-switch" title="Switch to 2D top-down view">2D</button>

            <!-- Site Selector (inline with buttons) -->
            <div id="siteSelector" class="control-item site-selector">
                <select id="siteDropdown">
                    <!-- Options populated by JavaScript -->
                </select>
            </div>
        </div>

        <!-- Bottom row: layer controls -->
        <div class="control-group data-controls">
            <!-- Layer Controls -->
            <div id="layerControls" class="layer-controls" style="display: none;">
                <div class="layer-section">
                    <div class="layer-toggle" id="plantableAreasToggle">
                        <span>Plantable Areas</span>
                        <div class="layer-toggle-arrow"></div>
                    </div>
                    <div id="plantableSubOptions" class="sub-options" style="display: none;">
                        <!-- Dynamically populated PA categories -->
                    </div>
                </div>
                <div class="layer-section">
                    <div class="layer-toggle" id="nonPlantableAreasToggle">
                        <span>Non-Plantable Areas</span>
                        <div class="layer-toggle-arrow"></div>
                    </div>
                    <div id="nonPlantableSubOptions" class="sub-options" style="display: none;">
                        <!-- Dynamically populated NPA categories -->
                    </div>
                </div>
                <div class="layer-section">
                    <div class="layer-toggle" id="ecologicalMetricsToggle">
                        <span>Ecological Niche Metrics</span>
                        <div class="layer-toggle-arrow"></div>
                    </div>
                    <div id="metricsOptions" class="metrics-options" style="display: none;">
                        <label class="metric-radio"><input type="radio" name="metric" value="moisture"> Moisture Level</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="lightHours"> Light Hours</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="pH"> Soil pH</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="nitrogen"> Nitrogen (N)</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="phosphorus"> Phosphorus (P)</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="potassium"> Potassium (K)</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="organic"> Organic Matter</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="drought"> Drought Risk</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="flood"> Flood Risk</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="wind"> Wind Exposure</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Application Scripts -->
    <script>
        // Log the very first moment scripts start loading
        // HTML parsing logging removed for cleaner console output
    </script>
    <script type="module" src="/js/utilities.js"></script>
    <script src="/js/main.js"></script>

    <!-- Map Managers -->
    <script src="/js/CesiumManager.js"></script>
    <!-- GoogleMaps2DManager.js removed to improve performance -->
    <script src="/js/UnifiedLODManager.js"></script>
    <script src="/js/UserManager.js"></script>
    <script src="/js/GaussianSplatManager.js"></script>

    <!-- Navigation and Tours -->
    <script src="/js/navigation.js"></script>
    <script src="/js/narratives.js"></script>

    <!-- View Controls -->
    <script src="/js/tilt.js"></script>
    <script src="/js/orbit.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/viewTransform.js"></script>
    <script src="/js/view2D.js"></script>
    <script src="/js/two2D.js"></script>
    <script src="/js/transitionAnimation.js"></script>
    
    <!-- Data Visualization -->
    <script src="/js/layerControls.js"></script>
    <script src="/js/metricChart.js"></script>
    <script src="/js/focusPanel.js"></script>
    
    <!-- Development Tools -->
    <script src="/js/debugControls.js"></script>
</body>
</html>
