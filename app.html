<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ecological Digital Twin</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" /> 

    <!-- Cesium libraries removed - SuperSplat-only mode -->
    
    <!-- Proj4js for proper coordinate conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.min.js"></script>

    <!-- TensorFlow.js for matrix-based plant filtering -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>

    <!-- Snappy.js for matrix data decompression -->
    <script src="/js/data/snappy.js"></script>

    <!-- Two.js removed - SuperSplat-only mode -->

    <!-- 3D View CSS library -->
    <link href="/css/styles.css" rel="stylesheet">

    <!-- GoogleMaps2D CSS removed to improve performance -->

    <!-- Menu and View Switch CSS -->
    <link href="/css/menu.css" rel="stylesheet">
    
    <!-- Focus Panel CSS -->
    <link href="/css/focusPanel.css" rel="stylesheet">
    
    <!-- Configuration (must load first) -->
    <script src="/js/core/config.js"></script>
    <script type="module" src="/js/core/progressivePlyLoader.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgb(7, 43, 46);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    ">
        <img src="/images/ecodash_white_cropped.webp" alt="Ecodash Logo" style="
            max-width: 300px;
            margin-bottom: 40px;
        ">
        
        <div style="
            width: 400px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        ">
            <div id="loadingBar" style="
                width: 100%;
                height: 10px;
                background: rgba(255, 255, 255, 0.3);
                border-radius: 5px;
                overflow: hidden;
                margin-bottom: 25px;
            ">
                <div id="loadingProgress" style="
                    width: 100%;
                    height: 100%;
                    background: white;
                    border-radius: 5px;
                    transform: scaleX(0);
                    transform-origin: left;
                    transition: transform 0.1s ease-out;
                "></div>
            </div>
            
            <div id="loadingMessage" style="
                color: white;
                font-family: 'Courier New', monospace;
                font-size: 14px;
                font-weight: bold;
                margin-bottom: 8px;
            ">Loading...</div>
            <div id="loadingPercentage" style="
                color: white;
                font-family: 'Courier New', monospace;
                font-size: 16px;
                font-weight: bold;
            ">0%</div>
            <script>
            </script>
        </div>
    </div>


    <!-- SuperSplat Editor Container -->
    <div id="superSplatContainer" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
        display: none;
    "></div>

    <!-- GoogleMaps2D container removed to improve performance -->

    <!-- Terrain 3D Logo -->
    <img id="logo" src="/images/ecodash_white_cropped.webp" alt="Terrain 3D Logo">
    
    <!-- Message Box -->
    <div id="messageBox"></div>

    <!-- Unified Control Panel -->
    <div id="controlPanel" class="control-panel">
        <!-- Main control row: buttons + site selector + layer controls -->
        <div class="control-group main-controls">
            <!-- Tilt Controls - COMMENTED OUT -->
            <!-- <button id="tilt0Button" class="control-button icon-button tilt-0-button" title="Top-down view"></button>
            <button id="tilt45Button" class="control-button icon-button tilt-45-button" title="Angled view"></button> -->

            <!-- Rotation Controls - COMMENTED OUT -->
            <!-- <button id="rotateLeftButton" class="control-button icon-button rotate-left-button" title="Rotate left 90°"></button>
            <button id="rotateRightButton" class="control-button icon-button rotate-right-button" title="Rotate right 90°"></button> -->

            <!-- Navigation Controls -->
            <!-- <button id="homeButton" class="control-button icon-button home-button" title="Go to my location"></button>
            <button id="terrainToggleButton" class="control-button text-button terrain-toggle" title="Switch between high quality and performance modes">HQ</button> -->
            <!-- SuperSplat button removed - SuperSplat-only mode -->

            <!-- Site Selector hidden - SuperSplat-only mode -->
            <div id="siteSelector" class="control-item site-selector" style="display: none;">
                <select id="siteDropdown">
                    <!-- Options populated by JavaScript -->
                </select>
            </div>

            <!-- Layer Controls (moved from bottom row) -->
            <div id="layerControls" class="layer-controls" style="display: none;">
                <div class="layer-section">
                    <div class="layer-toggle" id="plantableAreasToggle">
                        <span>Plantable Areas</span>
                        <div class="layer-controls-right">
                            <button id="paVisibilityToggle" class="visibility-toggle-button" title="Toggle PA visibility">
                                <img src="/images/visible.png" alt="Toggle Visibility">
                            </button>
                            <div class="layer-toggle-arrow"></div>
                        </div>
                    </div>
                    <div id="plantableSubOptions" class="sub-options" style="display: none;">
                        <!-- Dynamically populated PA categories -->
                    </div>
                </div>
                <div class="layer-section">
                    <div class="layer-toggle" id="nonPlantableAreasToggle">
                        <span>Non-Plantable Areas</span>
                        <div class="layer-controls-right">
                            <button id="npaVisibilityToggle" class="visibility-toggle-button" title="Toggle NPA visibility">
                                <img src="/images/visible.png" alt="Toggle Visibility">
                            </button>
                            <div class="layer-toggle-arrow"></div>
                        </div>
                    </div>
                    <div id="nonPlantableSubOptions" class="sub-options" style="display: none;">
                        <!-- Dynamically populated NPA categories -->
                    </div>
                </div>
                <div class="layer-section">
                    <div class="layer-toggle" id="ecologicalMetricsToggle">
                        <span>Ecological Niche Metrics</span>
                        <div class="layer-toggle-arrow"></div>
                    </div>
                    <div id="metricsOptions" class="metrics-options" style="display: none;">
                        <label class="metric-radio"><input type="radio" name="metric" value="soilMoisture"> Moisture Level</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="sunlight"> Light Hours</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="pH"> Soil pH</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="nitrogen"> Nitrogen (N)</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="phosphorus"> Phosphorus (P)</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="potassium"> Potassium (K)</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="organicMatter"> Organic Matter</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="droughtRisk"> Drought Risk</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="floodRisk"> Flood Risk</label>
                        <label class="metric-radio"><input type="radio" name="metric" value="windExposure"> Wind Exposure</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Application Scripts -->
    <script>
        // Log the very first moment scripts start loading
    </script>
    <script src="/js/core/siteDataManager.js"></script>
    <script src="/js/core/applicationBootstrap.js"></script>
    <script type="module" src="/js/core/utilities.js"></script>
    <script src="/js/core/main.js"></script>

    <!-- Map Managers -->
    <script src="/js/managers/userManager.js"></script>
    <script src="/js/rendering/superSplatManager.js"></script>
    <script src="/js/rendering/coordinateTransform.js"></script>
    <!-- Polygon Manager - Must load before SuperSplat Bridge -->
    <script src="/js/rendering/polygonManager.js"></script>
    <script src="/js/rendering/superSplatBridge.js"></script>

    <!-- Navigation and Tours - Removed: Cesium-dependent flyTo system -->

    <!-- View Controls -->
    <!-- View control files removed - SuperSplat-only mode -->
    
    <!-- Data Visualization -->
    <script src="/js/data/ecologicalMetrics.js"></script>
    <script src="/js/data/PlantDataProcessor.js"></script>
    <script src="/js/ui/layerControls.js"></script>
    <script src="/js/data/metricChart.js"></script>
    <script src="/js/ui/plantRecommendationsPage.js"></script>
    <script src="/js/ui/cartManager.js"></script>
    <script src="/js/ui/focusPanel.js"></script>
</body>
</html>
